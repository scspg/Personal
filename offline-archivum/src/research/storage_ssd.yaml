# storage_ssd.yaml - SSD-kutatás, offline "civilizáció-újraépítő" archívumhoz
# Dátum: 2026-11-14. Árfolyam: 1 EUR = 365.60 HUF (ECB referencia, 2026-11-13).
# Forrás-jelölés: "mért" = ma lekért oldalon látott ár; "becsült" = keresőtalálat-kivonat, gyári
#   listaár vagy számított érték (nem ellenőrzött, lehet elavult).
# Elérhetőség ma (2026-11-14):
#   - ipon.hu: elérhető, minden ipon-ár mért (bruttó; az ipon nem tart saját raktárt, a
#     "szállítás N nap" az oldal deliveryDays adata).
#   - aqua.hu és senetic.hu: termékoldalak elérhetők (mért).
#   - alternate.de: elérhető, mért EUR-árak NÉMET 19% áfával. Magyarországra ajánlatkéréssel
#     (Angebotsanfrage) szállít, UPS 15.90-18.90 EUR, a magyar 27% áfával az ár kb. x1.067.
#   - BLOKKOLT (Cloudflare/403/511): arukereso.hu, alza.hu, emag.hu, edigital.hu, mediamarkt.hu,
#     geizhals.eu/.de/.at, idealo, galaxus, amazon.de (captcha). Ezeknél csak keresőtalálatból
#     származó URL szerepel, az ár "becsült / nem ellenőrzött".
#   - bestbyte.hu: elérhető, de az árat JavaScript tölti be, így nem olvasható ki.
# Piaci háttér: 2025-2026-ban NAND-hiány van, az SSD-árak a 2025-ös szint 2-4-szeresén vannak
#   (Tom's Hardware: a Phison vezérigazgatója szerint a NAND ára több mint duplázódott;
#   TrendForce: 2026 Q4-ben az enterprise SSD szerződéses ára +23-28% negyedévente).

