    - {bolt: The Register, url: "https://www.theregister.com/2023/08/17/western_digital_sandisk_ssd_lawsuit/"}
  elonyok: []
  hatranyok:
    - "2023 tavaszán az Extreme / Extreme PRO V2 (főleg 4TB és 2TB) és a My Passport SSD hirtelen adatvesztéssel, csatolhatatlansággal hibázott"
    - "A WD 2023 májusában firmware-frissítést adott ki. Az Attingo adatmentő cég hardverhibát (forrasztás, alkatrész) állított, a WD ezt tagadja. Később erősebb epoxis rögzítés is jött."
    - "Csoportos perek indultak 2023 augusztusában: Krum v. Western Digital, N.D. Cal. 5:23-cv-04152, és Pousa v. WD. Mai keresésem alapján NEM találtam megerősített ítéletet vagy egyezséget, így jogilag nincs lezárva."
    - "Gyakorlati következtetés: a mostani gyártás valószínűleg rendben van, de vásárlás után azonnal frissítsd a firmware-t (SanDisk Dashboard), és SanDisk soha ne legyen az egyetlen példány. A második másolat legyen más gyártótól."
  ajanlas_szint: kozep

