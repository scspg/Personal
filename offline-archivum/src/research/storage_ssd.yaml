---
# 2. YAML-dokumentum: adatmegőrzés, "egy eszköz" opciók, kockázatszámítás, javaslat
adatmegorzes_tenyek:
  jedec_jesd218:
    - "Kliens SSD: 1 év kikapcsolt állapotban 30 °C-on (használat közben 40 °C, napi 8 óra)"
    - "Enterprise SSD: 3 hónap kikapcsolt állapotban 40 °C-on (használat közben 55 °C, napi 24 óra)"
    - "Ezek MINIMUM értékek egy élettartama végén járó (a teljes TBW-t elhasznált) meghajtóra. Egy friss, keveset írt meghajtó jellemzően sokkal tovább megőrzi az adatot, de ezt semmi nem garantálja."
  homerseklet: "A kikapcsolt megőrzési idő a tárolási hőmérséklettel meredeken csökken. A JEDEC-táblázatok (Cox, FMS; AnandTech) szerint +5 °C nagyjából felezi. Tárolás: hűvös helyen (15-20 °C), nem padláson vagy autóban."
  tlc_vs_qlc: "A QLC 16 feszültségszintet tárol cellánként (a TLC 8-at), kisebb a hibahatár, és kevesebb P/E ciklust bír. Hosszú kikapcsolt archiválásra a TLC a jobb (pl. 9100 PRO, 870 EVO, Micron 6550 ION, Kioxia CD8P); QLC: 870 QVO, Solidigm D5-P5336, Kioxia LC9."
  gyakorlat:
    - "3-6 havonta kapcsold be (enterprise QLC-t 3 havonta), és OLVASS VÉGIG MINDENT. A puszta bekapcsolás nem frissíti a cellákat; a teljes olvasáskor a vezérlő felismeri a gyengülő blokkokat és áthelyezi őket."
    - "ZFS (zpool scrub) vagy Btrfs (btrfs scrub): checksum minden blokkon, tükör/RAIDZ esetén önjavítás"
    - "exFAT/NTFS-en: sha256sum manifest + par2 (kb. 10% redundancia) a nagy fájlokhoz (ZIM, modellek)"
    - "Legalább 2 független példány, eltérő gyártótól/vezérlőtől; ebből 1 offline"
  forrasok:
    - "https://www.anandtech.com/show/9248/the-truth-abou"
    - "https://www.dell.com/support/kbdoc/en-ca/000198930/ssd-data-retention-considerations-when-powering-off-systems-for-a-prolonged-duration"
    - "https://community.solidigm.com/hzhwu46669/attachments/hzhwu46669/Solid_State_Drives/3096/1/App_note_SSD_Data_retention.pdf"
    - "https://files.futurememorystorage.com/proceedings/2011/20110810_T1B_Cox.pdf"

egy_eszkoz_opciok:   # (a) a legsűrűbb egyetlen-SSD megoldás kapacitásonként
  - szint: "8TB"
    opciok:
      - "SanDisk Extreme 8TB: 565 589 Ft (ipon, mért). Buszról táplált, néhány W, nem kell hűtés. IP65, 3 m esés."
      - "Crucial X10 8TB: IP65, 2 GB/s. Itthon nem találtam árat."
      - "Samsung T5 EVO 8TB: 1 879 EUR (alternate, mért). Lassú, nem strapabíró."
      - "Samsung 9100 PRO 8TB + OWC Express 1M2 = 868 089 + 56 590 = 924 679 Ft (ipon, mért). Kb. 7-9 W aktív, passzív hűtés. Nem vízálló, vízálló tokban kell tárolni."
    megorzesi_kockazat: "Kliens SSD: JEDEC-minimum 1 év 30 °C-on; TLC (9100 PRO) jobb, a nem publikált/QLC NAND-ú típusok gyengébbek"
  - szint: "16TB"
    opciok:
      - "Fogyasztói 16TB-os SSD-t nem találtam ellenőrzött boltban."
      - "Kioxia CD8-P 15.36TB U.2 (ipon, 4 137 890 Ft, mért) + ICY DOCK MB307U-1VB (70 890 Ft, mért) = kb. 4 208 780 Ft. 20-25 W aktív, 30 W-os tápegység, ventilátor kell."
      - "Olcsóbb: 2 db 8TB (lásd fent), de ez már 2 eszköz"
    megorzesi_kockazat: "Enterprise JEDEC-minimum: 3 hónap 40 °C-on. A TLC miatt a valóságban jobb, de 3 havonta be kell kapcsolni és scrubolni."
  - szint: "30.72TB"
    opciok:
      - "Solidigm D5-P5336 30.72TB: 1 921 854 Ft (senetic, mért, de NINCS raktáron, valószínűleg elavult listaár) + MB307U = kb. 1 992 744 Ft (becsült)"
      - "Kioxia CD8P-R 30.72TB: 7 700 231 Ft (senetic, mért, nincs raktáron) + MB307U"
    fogyasztas_hutes: "25 W max, kevesebb mint 5 W alapjáraton. Az MB307U passzív, ezért 40 mm-es vagy USB-s ventilátor ajánlott."
    megorzesi_kockazat: "QLC + enterprise: a legnagyobb kikapcsolt kockázat; 3 havonta be kell kapcsolni és végig kell olvasni (USB4-en 30TB kb. 2.5-3 óra)"
  - szint: "61.44TB"
    opciok: ["Solidigm D5-P5336 61.44TB: 7 090.99 EUR, azaz kb. 2.59 M Ft (e-nitiative, becsült keresőtalálat, valószínűleg elavult) + MB307U", "Micron 6550 ION 61.44TB (TLC!): nincs ár"]
  - szint: "122.88TB"
    opciok: ["Solidigm D5-P5336 122.88TB: 23 903-54 633 USD, azaz kb. 7.9-18.1 M Ft (becsült, keresőtalálat) + MB307U"]
  - usb4_u2_haz_letezik: "IGEN: ICY DOCK MB307U-1VB (USB4 40 Gbps, U.2/U.3, 15mm), alternate.de 193.90 EUR, mért: https://www.alternate.de/Icy-Dock/MB307U-1VB-Adapter/html/product/100194424"

egy_vs_ket_peldany:   # (b) számszerűsített válasz
  bemenetek:
    - "Backblaze SSD (boot meghajtók), élettartam-AFR kb. 0.9%/év (2018 Q4 - 2023 Q2): https://www.theregister.com/2023/09/26/ssd_failure_report_backblaze"
    - "Backblaze HDD, 2024-es negyedéves AFR 1.35-1.89%: https://backblaze.com/blog/backblaze-drive-stats-for-2024"
    - "JEDEC kikapcsolt megőrzés: kliens 1 év / enterprise 3 hónap (élettartam végén)"
  egy_ssd: "Csak hardverhiba miatt kb. 4.4% esély az adatvesztésre 5 év alatt (1-(1-0.009)^5). Ehhez jön minden, amit az AFR nem tartalmaz: törlés, ransomware, lopás, tűz, víz, túlfeszültség, sorozathibás firmware (lásd SanDisk 2023), és a kikapcsolt állapotú adatvesztés, ha 1 évnél tovább nincs bekapcsolva. A valós kockázat ezért inkább 5-10% / 5 év."
  ssd_plusz_offline_masolat: "Független hibákat, negyedéves ellenőrzést és 2 hetes cserét feltételezve: a fő példány évente kb. 0.9% eséllyel hal meg. Annak esélye, hogy a másolat épp akkor rejtetten halott vagy a csere alatt hal meg, kb. 1.6% x (0.125 + 14/365) = kb. 0.26%. Együtt kb. 0.0023%/év, azaz kb. 0.01% 5 év alatt. Ez kb. 400-szor kisebb kockázat, és a másolat offline volta a ransomware, a túlfeszültség és a véletlen törlés ellen is véd."
  kovetkeztetes: "Az egyetlen eszköz kompromisszumként csak akkor elfogadható, ha mellette van legalább 1 offline, más gyártótól származó másolat (HDD vagy SSD). 'Soha ne vesszen el' = minimum 2 példány, ebből 1 offline + checksum + scrub."

ket_eszkozos_minimal_setup:   # (c) egyszeres hiba + víz/ütés + EMP ellen
  elv: "A: aktív, strapabíró példány (IP65, ütésálló). B: offline példány MÁS gyártótól, Faraday-zsákban, egy zárt fémdobozban (kettős árnyékolás), szivacsbetéttel ütés ellen, vízzáró tömítéssel. Nincs rajta kábel. Ellenőrzés: egy bent lévő telefonnak nem szabad térerőt kapnia."
  szint_8tb:
    A: "SanDisk Extreme 8TB: 565 589 Ft (ipon, mért), IP65, 3 m esés"
    B: "Samsung 9100 PRO 8TB + OWC Express 1M2: 924 679 Ft (ipon, mért). Más gyártó és vezérlő, és USB4-en gyors a teljes olvasás. Olcsóbb B: egy 8TB-os HDD (lásd a HDD-kutatást; referencia: Seagate Exos 7E10 8TB 433 EUR, alternate.de, mért, belső SATA)."
    faraday: "Mission Darkness Faraday-zsák: kb. 78-310 EUR (datawaysecurity.com, becsült keresőtalálat), pl. https://www.datawaysecurity.com/faraday-bags-for-large-electronic/93-mission-darkness-padded-utility-faraday-bag.html"
    osszesen: "kb. 1.49 M Ft + Faraday-zsák és doboz"
  szint_30tb:
    A: "Solidigm D5-P5336 30.72TB + ICY DOCK MB307U-1VB: kb. 1.99 M Ft (becsült, nincs raktáron)"
    B: "Ugyanez, vagy a költség töredékéért HDD-k (lásd a HDD-kutatást). 2 db SSD-vel kb. 4 M Ft listaáron; a valós 2026-os ár ennek a többszöröse lehet."
    megjegyzes: "A 30-120TB-os all-flash archívum 2026-ban TB-onként 60-270 ezer Ft (ellenőrzött in-stock: kb. 270 ezer Ft/TB). Az SSD + HDD hibrid sokkal racionálisabb."

javaslat:
  gaming_pc_munkameghajto_llm:
