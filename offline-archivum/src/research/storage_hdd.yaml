kockazat_elemzes:   # (b) Egy eszköz vs. 1 elsődleges + 1 offline másolat
  backblaze_q2_2026:
    flotta_elettartam_afr: "1,41% (353 041 lemez)"
    flotta_negyedeves_afr: "1,73% (354 415 lemez, évek óta a legmagasabb)"
    modellek_elettartam_afr: {Seagate_ST24000NM002H_Exos_X24_24TB: "3,24%", Toshiba_MG10ACA20TE_20TB: "0,79%", Toshiba_MG11ACA24TE_24TB: "0,50%", WDC_WUH722222ALE6L4_22TB: "0,58%", WDC_WUH722626ALE6L4_26TB: "0,84%"}
    forras: "https://www.backblaze.com/blog/backblaze-drive-stats-for-q2-2026/"
  szamitas_10_ev:
    modszer: "P(1 lemez 10 év alatt meghibásodik) = 1-(1-AFR)^10. Két független másolatnál, ha félévente ellenőrzöd és cseréled a hibásat: P(adatvesztés) ≈ 10 év x AFR1 x AFR2 x 0,5 év (az az ablak, amíg egy hiba észrevétlen marad)."
    egy_masolat:
      "AFR 0,5% (MG11)": "4,9%"
      "AFR 1,41% (flotta)": "13,2%"
      "AFR 2,41% (flotta + ~1%/év egyéb: tűz, víz, lopás, túlfeszültség, felhasználói hiba – becsült)": "21,7%"
      "AFR 3,24% (Exos X24)": "28,1%"
    ket_masolat_felevente_ellenorizve:
      "AFR 1,41%": "~0,10% (kb. 1:1000)"
      "AFR 2,41%": "~0,29% (kb. 1:350)"
      "AFR 3,24%": "~0,53%"
    ket_masolat_karbantartas_nelkul_10_evig: "AFR 2,41% mellett ~4,7%"
    bit_rot_ure: "Egy 32 TB-os lemez teljes kiolvasása = 2,56x10^14 bit. 1/10^15 URE-specifikáció mellett ez ~0,26 várható olvashatatlan szektor, vagyis ~23% esély legalább egy hibára teljes olvasásonként (a spec felső korlát, a valóság jellemzően jobb). Egy másolattal a hibás fájl elveszik; ZFS + második másolattal automatikusan javítható."
  konkluzio: "Az 1 elsődleges + 1 offline (más helyen, más gyártótól) másolat ~20%-ról ~0,3%-ra viszi le a 10 éves adatvesztési kockázatot (~70x javulás), és csak +1 lemezbe kerül. Ez a minimum logikus kompromisszum. A korrelált hibák (azonos gyártási sorozat, közös lakás, közös villám) ezt rontják, ezért: két különböző gyártó, két helyszín, az offline lemez Faraday-tasakban."

